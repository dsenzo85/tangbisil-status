owner: dsenzo85
repo: tangbisil-status

sites:
  - name: 홈
    url: https://tangbisil.kr/
    maxResponseTime: 10000
  - name: 연봉 계산기
    url: https://tangbisil.kr/salary/
    maxResponseTime: 10000
  - name: 노무 소식
    url: https://tangbisil.kr/news/
    maxResponseTime: 10000
  - name: 오늘의 투표(API)
    url: https://tangbisil.kr/api/poll
    expectedStatusCodes:
      - 200
    maxResponseTime: 10000
    __dangerous__body_down_if_text_missing: '"options"'

workflowSchedule:
  uptime: "*/5 * * * *"
  responseTime: "0 23 * * *"
  graphs: "0 0 * * *"
  summary: "0 0 * * *"
  staticSite: "0 1 * * *"
  updates: "0 3 * * 0"

assignees:
  - dsenzo85

status-website:
  baseUrl: /tangbisil-status
  name: 탕비실 상태
  introTitle: "탕비실(tangbisil.kr) 가동 상태"
  introMessage: 5분마다 바깥에서 확인해요.
  navbar:
    - title: 탕비실
      href: https://tangbisil.kr/
